<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Showcase · Title with Photo BG</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/slide.css">
<style>
/* Abstract mountain landscape as SVG data URI for the background image */
.bg-mountains {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.bg-mountains img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
</style>
</head>
<body>
<div class="slide section-theme-1">

  <div class="bg-mountains">

       alt="">

  <!-- Dark overlay -->
  <div class="bg-overlay bg-overlay-soft"></div>

  <!-- Corner accents -->
  <div class="corner-accent tr"></div>
  <div class="corner-accent bl"></div>

  <!-- Title content -->
  <div class="title-content" style="z-index:2;">
    <p class="label" style="margin-bottom:12pt;">Workshop Training</p>
    <h1 class="display-large">Claude Chat, Cowork<br>&amp; Skills Training</h1>
    <p class="subtitle">How to delegate work to AI safely and effectively</p>
    <div class="sec-divider"></div>
    <p style="font-size:11pt;color:#7a8796;max-width:50%;">A hands-on workshop for teams building with AI</p>
  </div>

  <!-- Shard decoration -->
  <div class="transition-diamond small" style="bottom:48pt;right:52pt;top:auto;left:auto;opacity:0.05;"></div>
</div>
</body>
</html>
