<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=540">
<title>Opening & Foundations · Title</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/slide.css">
<style>
/* 120% detail: oversized section number + angular grid composition */
.deck-title {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  overflow: hidden;
}
/* Large transparent number */
.deck-title .big-num {
  position: absolute;
  right: 80pt;
  bottom: -20pt;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300;
  font-size: 540pt;
  color: #d4dde8;
  opacity: 0.015;
  line-height: 1;
  user-select: none;
  pointer-events: none;
  letter-spacing: -0.04em;
}
/* Subtle corner shards */
.deck-title .shard-corner {
  position: absolute;
  pointer-events: none;
}
.deck-title .shard-corner.tl {
  top: 0; left: 0;
  width: 280pt; height: 280pt;
  background: linear-gradient(135deg, rgba(154,170,188,0.03) 0%, transparent 60%);
  clip-path: polygon(0 0, 100% 0, 0 100%);
}
.deck-title .shard-corner.br {
  bottom: 0; right: 0;
  width: 360pt; height: 360pt;
  background: linear-gradient(315deg, rgba(154,170,188,0.025) 0%, transparent 60%);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
/* Fine rule line */
.deck-title .rule-line {
  position: absolute;
  left: 80pt;
  top: 50%;
  width: 120pt;
  height: 1px;
  background: #9aaabc;
  opacity: 0.15;
}
</style>
</head>
<body>
<div class="slide section-theme-1">
  <div class="accent-band top"></div>
  <div class="corner-accent tr"></div>
  <div class="corner-accent bl"></div>

  <div class="deck-title">
    <div class="big-num">01</div>
    <div class="shard-corner tl"></div>
    <div class="shard-corner br"></div>
    <div class="rule-line" style="top:43%;"></div>
  </div>

  <div class="title-content" style="z-index:2;">
    <p class="label" style="margin-bottom:16pt;">Part 01 / 09 · Opening &amp; Foundations</p>
    <h1 class="display-large">The Way You Work<br>Is About to Change</h1>
    <p class="subtitle">A practical introduction to AI that actually works</p>
    <div class="sec-divider"></div>
    <p style="font-size:16pt;color:#7a8796;max-width:50%;">This is not a technical training. You don't need to know how to code. You just need to know how to delegate.</p>
  </div>
</div>
</body>
</html>
