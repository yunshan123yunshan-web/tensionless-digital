<!DOCTYPE html>

<head>

<title>Transition · Section 4 → 5</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/slide.css">
<style>
.burst-container {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  overflow: hidden;
}
.burst-shard { position:absolute; background:#d4dde8; pointer-events:none; }
</style>
</head>
<body>
<div class="slide section-theme-5">
  <div class="burst-container">
    <div class="burst-shard" style="width:160pt;height:160pt;clip-path:polygon(100% 0%,0% 100%,100% 100%);opacity:0.025;top:-20pt;right:-20pt;"></div>
    <div class="burst-shard" style="width:80pt;height:80pt;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);opacity:0.04;top:100pt;right:80pt;transform:rotate(45deg);"></div>
    <div class="burst-shard" style="width:200pt;height:200pt;clip-path:polygon(0% 0%,100% 0%,0% 100%);opacity:0.015;bottom:-20pt;left:-20pt;"></div>
    <div class="burst-shard" style="width:60pt;height:60pt;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);opacity:0.03;bottom:120pt;left:100pt;"></div>
    <div class="burst-shard" style="width:14pt;height:14pt;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);opacity:0.03;top:40%;right:28%;"></div>
  </div>

  <div class="accent-band top" style="--sec-accent:#96a4b2;"></div>

  <div class="transition-content" style="z-index:2;">
    <p class="label" style="margin-bottom:10pt;">End of Section 4</p>
    <h1>Why Claude</h1>
    <div style="display:flex;justify-content:center;"><div class="sec-divider"></div></div>
    <p style="text-align:center;margin-top:8pt;color:#7a8796;">Up next — Chat, Cowork, or Skills? Choosing the right mode</p>
  </div>

  <div class="transition-diamond" style="top:auto;bottom:80pt;right:52pt;width:50pt;height:50pt;opacity:0.02;"></div>
</div>
</body>
