<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960">
<title>Claude Training Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#090909;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#b8c4d0;font-size:18pt;line-height:1.55;-webkit-font-smoothing:antialiased}

#stage{position:fixed;top:50%;left:50%;transform-origin:top left;width:960px;height:540px;background:#090909;box-shadow:0 10px 60px rgba(0,0,0,0.4)}
.slide{position:absolute;top:0;left:0;width:960px;height:540px;background:#090909;padding:42pt 48pt;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .35s ease;overflow:hidden}
.slide.active{opacity:1;pointer-events:auto}
.slide .bg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.slide .content{position:relative;z-index:2;display:flex;flex-direction:column;flex:1}

/* Section themes */
.theme-1{--accent:#9aaabc;--accent-soft:rgba(154,170,188,0.06)}
.theme-2{--accent:#96a4b2;--accent-soft:rgba(150,164,178,0.06)}
.theme-3{--accent:#7a8796;--accent-soft:rgba(122,135,150,0.06)}
.theme-4{--accent:#b8c4d0;--accent-soft:rgba(184,196,208,0.06)}
.theme-5{--accent:#d4dde8;--accent-soft:rgba(212,221,232,0.06)}
.theme-ws{--accent:#96a4b2;--accent-soft:rgba(150,164,178,0.08)}

.accent-bar{position:absolute;top:0;left:0;width:100%;height:3pt;background:var(--accent,#9aaabc);opacity:.5;z-index:3}
.accent-strip{position:absolute;width:200pt;height:100%;background:var(--accent-soft);pointer-events:none}
.accent-strip.l{left:0;top:0}
.accent-strip.r{right:0;top:0}
.corner{position:absolute;width:70pt;height:70pt;pointer-events:none;z-index:3}
.corner.tr{top:0;right:0;border-right:1pt solid rgba(212,221,232,0.06);border-top:1pt solid rgba(212,221,232,0.06)}
.corner.bl{bottom:0;left:0;border-left:1pt solid rgba(212,221,232,0.06);border-bottom:1pt solid rgba(212,221,232,0.06)}

h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:42pt;color:#d4dde8;line-height:1.12;margin:0 0 12pt 0;letter-spacing:-.01em}
h1.lg{font-size:50pt}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:28pt;color:#d4dde8;line-height:1.2;margin:0 0 10pt 0}
h3{font-family:'Inter',system-ui,sans-serif;font-weight:500;font-size:16pt;color:#96a4b2;line-height:1.3;margin:0 0 8pt 0}
p{margin:0 0 8pt 0;font-size:14pt;color:#b8c4d0;line-height:1.5}
p.sm{font-size:12pt;color:#7a8796}
p.xs{font-size:10pt;color:#5a6067;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
p.label{font-size:10pt;font-weight:500;color:#5a6067;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
strong{color:#d4dde8;font-weight:500}
em{color:#96a4b2;font-style:italic}

.divider{width:48pt;height:1px;background:var(--accent,#96a4b2);margin:8pt 0 16pt 0;opacity:.35}

.focus{border:1px solid #1a1c20;background:#0c0d0f;padding:14pt 18pt;margin:10pt 0}
.focus p{font-size:13pt;color:#d4dde8;margin:0}
.focus p.sm{font-size:11pt;color:#96a4b2;margin-top:4pt}

.tip{border-left:3pt solid #5a6067;padding:10pt 0 10pt 16pt;margin:8pt 0}
.tip p{font-size:12pt;color:#96a4b2;margin:0}

.code{border:1px solid #1a1c20;background:#0c0d0f;padding:12pt 16pt;margin:8pt 0;font-family:'Inter',monospace;font-size:11pt;line-height:1.5;color:#96a4b2;white-space:pre-wrap}
.code p{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;margin:0}

.cols{display:flex;gap:24pt;flex:1}
.col{flex:1}
.col-2{flex:2}

/* Title slide */
.s-title{align-items:center;justify-content:center;text-align:center}
.s-title h1{font-size:52pt;margin-bottom:8pt}
.s-title p{font-size:16pt;color:#96a4b2}
.s-title .meta{position:absolute;bottom:32pt;left:0;width:100%;text-align:center}
.s-title .meta p{font-size:10pt;color:#5a6067}

/* Section title slide */
.s-section{align-items:center;justify-content:center;text-align:center}
.s-section h1{font-size:44pt}
.s-section .num{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:80pt;color:var(--accent,#96a4b2);opacity:.15;line-height:1;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}

/* Workshop slide */
.ws-label{display:inline-block;font-size:10pt;font-weight:600;color:var(--accent,#96a4b2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4pt}
.ws-step{border-left:2pt solid var(--accent,#96a4b2);padding:4pt 0 4pt 14pt;margin-bottom:4pt}
.ws-step p{font-size:12pt;margin:0}
.ws-step .n{font-size:9pt;font-weight:600;color:#5a6067;letter-spacing:.08em;text-transform:uppercase}

/* Counter */
#counter{position:fixed;bottom:16px;right:20px;background:rgba(0,0,0,.65);color:#b8c4d0;padding:4px 12px;border-radius:999px;font-size:11px;letter-spacing:.05em;z-index:100;user-select:none;opacity:.7}
#counter:hover{opacity:1}

/* Nav */
.nav-z{position:fixed;top:0;bottom:0;width:12%;cursor:pointer;z-index:50}
.nav-z.l{left:0}
.nav-z.r{right:0}
.nav-h{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:18px;opacity:0;transition:opacity .2s}
.nav-z.l .nav-h{left:12px}
.nav-z.r .nav-h{right:12px}
.nav-z:hover .nav-h{opacity:1}

/* Lists */
ul{list-style:none;padding:0;margin:4pt 0}
li{padding:3pt 0 3pt 14pt;border-left:2pt solid #1e1e1e;font-size:12pt;color:#b8c4d0;margin-bottom:3pt}
li.accent{border-left-color:var(--accent,#96a4b2);color:#d4dde8}
li.sm{font-size:11pt;color:#7a8796}

/* Table */
.tbl{width:100%;border-collapse:collapse;margin:6pt 0}
.tbl th{font-size:11pt;font-weight:500;color:#96a4b2;text-align:left;padding:6pt 10pt;border-bottom:1px solid #1e1e1e;background:#0c0d0f}
.tbl td{font-size:11pt;color:#b8c4d0;padding:5pt 10pt;border-bottom:1px solid #1a1c20;vertical-align:top}

/* Checklist (for final slide) */
.cl{list-style:none;padding:0;margin:6pt 0}
.cl li{padding:3pt 0 3pt 20pt;font-size:11pt;color:#b8c4d0;position:relative;margin-bottom:2pt}
.cl li::before{content:"☐";position:absolute;left:0;color:#5a6067}
.cl li.done::before{content:"☑";color:#96a4b2}

/* Print */
@media print{@page{size:960pt 540pt;margin:0}html,body{background:#090909;overflow:visible;height:auto}#stage{position:static;transform:none!important;box-shadow:none}.nav-z,#counter{display:none!important}.slide{opacity:1!important;position:relative!important;page-break-after:always;height:540pt;pointer-events:auto!important}}
</style>
</head>
<body>

<div id="stage"><div id="deck"></div></div>
<div class="nav-z l" id="navL"><div class="nav-h">‹</div></div>
<div class="nav-z r" id="navR"><div class="nav-h">›</div></div>
<div id="counter">1 / 25</div>

<script>
// ── Slide data ──
const SLIDES = [
  // ═══ PART 1 — AI FOUNDATIONS ═══

  { theme: 'theme-1', render: function(d) {

  { theme: 'theme-1', render: function(d) {

  // ═══ PART 2 — CLAUDE BASICS ═══
  { theme: 'theme-2', render: function(d) {
    d.className='slide s-section theme-2';
    d.innerHTML=`

// ── Deck logic ──
const deck = document.getElementById('deck');
let current = 0;

function show(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  // Clear
  deck.innerHTML = '';
  // Render slide
  const div = document.createElement('div');
  SLIDES[idx].render(div);
  deck.appendChild(div);
  // Make it active
  const slide = deck.querySelector('.slide');
  if (slide) slide.classList.add('active');
  current = idx;
  document.getElementById('counter').textContent = `${idx + 1} / ${SLIDES.length}`;
  history.replaceState(null, '', '#' + (idx + 1));
}

function fit() {
  const s = Math.min(window.innerWidth / 960, window.innerHeight / 540);
  const x = (window.innerWidth - 960 * s) / 2;
  const y = (window.innerHeight - 540 * s) / 2;
  const stage = document.getElementById('stage');
  stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  stage.style.top = '0';
  stage.style.left = '0';
}

// Navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); show(Math.min(current + 1, SLIDES.length - 1)); break;
    case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); show(Math.max(current - 1, 0)); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End':  e.preventDefault(); show(SLIDES.length - 1); break;
    default:
      if (e.key >= '1' && e.key <= '9') { const i = parseInt(e.key,10)-1; if (i < SLIDES.length) { e.preventDefault(); show(i); } }
  }
});

document.getElementById('navL').addEventListener('click', () => show(Math.max(current - 1, 0)));
document.getElementById('navR').addEventListener('click', () => show(Math.min(current + 1, SLIDES.length - 1)));
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => { const m = location.hash.match(/^#(\d+)$/); if (m) show(parseInt(m[1],10)-1); });

// Start
const hash = location.hash.match(/^#(\d+)$/);
if (hash) current = Math.min(parseInt(hash[1],10)-1, SLIDES.length-1);
fit();
show(current);
</script>
